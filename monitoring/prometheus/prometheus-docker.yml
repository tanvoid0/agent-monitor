# Prometheus scrape config when BOTH Agent Monitor and Prometheus run in Docker on the
# shared `am` network (docker-compose.full.yml). The Host guard on the
# dashboard must allow `agent-monitor` — set via DASHBOARD_ALLOWED_HOSTS there.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - am-rules.yml

scrape_configs:
  - job_name: am
    metrics_path: /api/metrics
    static_configs:
      - targets: ["agent-monitor:4820"]
    authorization:
      type: Bearer
      credentials_file: /run/am-secrets/dashboard-token
